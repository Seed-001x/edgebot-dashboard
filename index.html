<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Edgebot Live</title>
<style>
:root{
  --bg:#0a0c0b; --panel:#101312; --raise:#161a18; --rule:#232826; --rule2:#1a1e1c;
  --text:#e8ece9; --dim:#8a928d; --faint:#5c645f;
  --green:#4ade80; --greenbg:#14241b; --red:#f87171; --redbg:#241414; --amber:#fbbf24;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);max-width:620px;margin:0 auto;padding:18px 20px 110px;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
/* section scaffold: eyebrow label, big light title, right-aligned meta */
.sec{border-top:1px solid var(--rule);margin-top:34px;padding-top:30px}
.sec:first-of-type{border-top:0;margin-top:14px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:12px}
.eyebrow .r{color:var(--faint);font-weight:500}
h2{font:300 34px/1.1 var(--sans);letter-spacing:-.01em;margin:12px 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);color:var(--faint);letter-spacing:.06em}
.badge{font:700 11px var(--mono);letter-spacing:.14em;padding:5px 9px;border:1px solid var(--rule)}
.badge.real{color:var(--red);border-color:#5a2a2a}
.badge.shadow{color:var(--green);border-color:#1f4a31}
/* rows */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-top:1px solid var(--rule2);font-size:15px}
.row:first-child{border-top:1px solid var(--rule)}
.row .k{color:var(--dim)} .row .v{font-family:var(--mono);font-size:14px;text-align:right}
.g{color:var(--green)} .r{color:var(--red)} .a{color:var(--amber)}
/* cards */
.card{background:var(--panel);border:1px solid var(--rule);padding:16px;margin:12px 0}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sym{font:700 19px var(--mono)}
.sub{font-size:13px;color:var(--faint);margin-top:4px}
.pnl{font:700 17px var(--mono)}
.hr{border-top:1px solid var(--rule);margin:14px 0 10px}
.small{font:500 11px var(--mono);color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.addr{font:11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:8px 0 10px}
/* buttons */
.btn{display:block;width:100%;text-align:center;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:13px 10px;background:var(--greenbg);color:var(--green);border:0;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;border:1px solid #5a2a2a;color:var(--red)}
.btn:disabled{opacity:.4}
.fb{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.fb div{display:flex;gap:8px}
.fb button{width:48px;height:44px;background:var(--raise);border:1px solid var(--rule);font:700 17px var(--mono);cursor:pointer}
.fb .x{color:var(--amber)} .fb .ok{color:var(--green)}
.tag{font:700 11px var(--mono);letter-spacing:.12em}
.tag.taken{color:var(--green)} .tag.skipped,.tag.filtered{color:var(--amber)}
.reason{font-size:14px;color:var(--dim);margin-top:10px;line-height:1.45}
/* grids / tables */
.grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);background:var(--panel)}
.grid>div{padding:14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.grid>div:nth-child(3n){border-right:0}.grid>div:nth-last-child(-n+3){border-bottom:0}
.grid .l{font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.grid .n{font:700 28px var(--mono);margin-top:10px}
.foot{font:11px var(--mono);color:var(--faint);margin-top:14px;letter-spacing:.03em}
table{width:100%;border-collapse:collapse;font-family:var(--mono)}
th{font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-align:right;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
td{padding:13px 0;border-bottom:1px solid var(--rule2);text-align:right;font-size:14px}
td:first-child{text-transform:uppercase;font-size:13px}
/* mirror */
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);margin-bottom:6px}
.tabs button{display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--dim);border:0;padding:15px 14px;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tabs button:nth-child(2n){border-right:0}.tabs button:nth-last-child(-n+2){border-bottom:0}
.tabs button .c{color:var(--faint);font-weight:500}
.tabs button.on{background:#e6f0ea;color:#101312}.tabs button.on .c{color:#4b5a51}
.coin{display:grid;grid-template-columns:34px 1fr auto;column-gap:10px;padding:16px 0 0;border-bottom:1px solid var(--rule)}
.coin .i{font:11px var(--mono);color:var(--faint);padding-top:5px}
.coin .n{font:700 16px var(--mono)} .coin .d{font-size:13px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.coin .m{font:700 14px var(--mono);text-align:right}
.coin .btn{grid-column:2 / 4;margin:12px 0 16px;padding:11px}
.mfb{grid-column:2 / 4;display:flex;gap:8px;margin-top:10px}
.mfb button{flex:1;height:40px;background:var(--raise);border:1px solid var(--rule);font:700 16px var(--mono);cursor:pointer}
.mfb .x{color:var(--amber)} .mfb .ok{color:var(--green)}
.empty{padding:22px 0;font:12px var(--mono);color:var(--faint);letter-spacing:.06em}
.err{color:var(--red)}
.refresh{position:fixed;right:18px;bottom:22px;width:52px;height:52px;border-radius:50%;background:var(--green);color:#06130b;border:0;font-size:22px;cursor:pointer;box-shadow:0 4px 18px #0008}
/* main tabs */
.maintabs{position:sticky;top:0;z-index:50;display:flex;gap:8px;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:8px}
.maintabs button{flex:1;padding:12px;background:var(--panel);color:var(--dim);border:1px solid var(--rule);border-radius:10px;cursor:pointer;font:600 13px var(--sans);letter-spacing:.06em}
.maintabs button.on{background:var(--greenbg);color:var(--green);border-color:#1f4a31}
.tabpage{display:none}
.tabpage.on{display:block}
</style>
</head>
<body>

<div class="top"><span id="updated">connecting…</span><span class="badge" id="mode">—</span></div>

<div class="maintabs">
<button id="mtab-overview" class="on" onclick="showMainTab('overview')">OVERVIEW</button>
<button id="mtab-mirror" onclick="showMainTab('mirror')">🪞 MIRROR</button>
<button id="mtab-signals" onclick="showMainTab('signals')">⚡ SIGNALS</button>
</div>

<div class="tabpage on" id="page-overview">

<section class="sec"><div class="eyebrow"><span>Live trading</span><span class="r" id="haltNote"></span></div>
  <h2>Engine</h2><div id="engine"></div></section>

<section class="sec"><div class="eyebrow"><span>Open risk</span><span class="r" id="posCount"></span></div>
  <h2>Positions</h2><div id="positions"></div></section>

<section class="sec"><div class="eyebrow"><span>Recent outcomes</span><span class="r" id="closedCount"></span></div>
  <h2>Trade history</h2><div id="trades"></div></section>

<section class="sec"><div class="eyebrow"><span>Guardrails</span><span class="r" id="day"></span></div>
  <h2>Risk ledger</h2><div id="ledger"></div></section>

<section class="sec"><div class="eyebrow"><span>Loop counters</span><span class="r" id="errCount"></span></div>
  <h2>Machine</h2><div class="grid" id="machine"></div><div class="foot" id="heartbeat"></div></section>

<section class="sec"><div class="eyebrow"><span>Discovery intake</span><span class="r" id="srcCount"></span></div>
  <h2>Discovery Sources</h2>
  <table><thead><tr><th>SOURCE</th><th>RETURNED</th><th>TAKEN</th></tr></thead><tbody id="sources"></tbody></table></section>

</div><!-- /page-overview -->
<div class="tabpage" id="page-mirror">

<section class="sec"><div class="eyebrow"><span>Bot input / pump.fun</span><span class="r" id="shown"></span></div>
  <h2>Pump.fun Mirror</h2>
  <div class="tabs" id="tabs"></div><div id="mirror"></div><div class="foot" id="mirrorFoot"></div></section>

</div><!-- /page-mirror -->
<div class="tabpage" id="page-signals">

<section class="sec"><div class="eyebrow"><span>Latest detections</span><span class="r" id="sigCount"></span></div>
  <h2>Signals</h2><div id="signals"></div></section>

</div><!-- /page-signals -->
<div class="tabpage on" id="page-overview-tail">

<section class="sec"><div class="eyebrow"><span>Feedback &amp; filters</span><span class="r" id="perfNote"></span></div>
  <h2>Performance</h2><div id="perf"></div></section>

</div><!-- /page-overview-tail -->

<button class="refresh" onclick="load()" aria-label="Refresh">↻</button>

<script>
// ---- config: change only this line if the bot's URL changes ----
const API = 'https://edgebot.onrender.com';
const REFRESH_MS = 10000;
const MIRROR_TABS = ['trending','movers'];

let reacted = {};
try { reacted = JSON.parse(localStorage.getItem('edgebot_reacted') || '{}'); } catch {}
const saveReacted = () => { try { localStorage.setItem('edgebot_reacted', JSON.stringify(reacted)); } catch {} };
let mirrorData = {}, mirrorTab = 'trending';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const row = (k, v) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const sol = (n, d = 4) => (Number(n) || 0).toFixed(d);
const money = n => { n = Number(n); if (!n) return '—'; return n >= 1e6 ? '$' + (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + (n/1e3).toFixed(1) + 'K' : '$' + n.toFixed(0); };
const ago = ts => { const s = Math.max(0, (Date.now() - ts) / 1000); return s < 60 ? Math.round(s) + 'S AGO' : s < 3600 ? Math.round(s/60) + 'M AGO' : s < 86400 ? Math.round(s/3600) + 'H AGO' : Math.round(s/86400) + 'D AGO'; };
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
const chartUrl = m => 'https://pump.fun/coin/' + encodeURIComponent(m);

async function get(p) {
  const r = await fetch(API + p + (p.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(p + ' → HTTP ' + r.status);
  return r.json();
}

async function feedback(mint, symbol, good, signalId, btn, kind) {
  btn.disabled = true;
  try {
    const r = await fetch(API + '/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mint, symbol, good, signalId, kind }) });
    if (!r.ok) throw new Error('http ' + r.status);
    reacted[signalId || mint] = true; saveReacted();
    const el = btn.closest('.card'); if (el) { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }
  } catch { btn.disabled = false; alert("Couldn't save — try again"); }
}
function fbHandler(el) { const d = el.dataset; feedback(d.mint, d.symbol, d.good === '1', d.sid, el, d.kind); }

async function mirrorFeedback(mint, symbol, good, btn) {
  btn.disabled = true;
  try {
    const r = await fetch(API + '/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mint, symbol, good, kind: 'mirror' }) });
    if (!r.ok) throw new Error('http ' + r.status);
    try {
      const done = JSON.parse(localStorage.getItem('mirror_done') || '{}');
      done[mint] = 1; localStorage.setItem('mirror_done', JSON.stringify(done));
    } catch {}
    const el = btn.closest('.coin');
    if (el) { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }
  } catch { btn.disabled = false; alert("Couldn't save — try again"); }
}

function showMirror(tab) { mirrorTab = tab; renderMirror(); }
function showMainTab(tab){
  ['overview','mirror','signals'].forEach(t=>{
    document.getElementById('mtab-'+t).classList.toggle('on', t===tab);
  });
  document.getElementById('page-overview').style.display = tab==='overview' ? 'block' : 'none';
  document.getElementById('page-overview-tail').style.display = tab==='overview' ? 'block' : 'none';
  document.getElementById('page-mirror').style.display = tab==='mirror' ? 'block' : 'none';
  document.getElementById('page-signals').style.display = tab==='signals' ? 'block' : 'none';
  window.scrollTo(0,0);
}
function renderMirror() {
  $('tabs').innerHTML = MIRROR_TABS.map(t => {
    const n = ((mirrorData[t] || {}).rows || []).length;
    return `<button class="${t === mirrorTab ? 'on' : ''}" onclick="showMirror('${t}')">${t}<span class="c">${n}</span></button>`;
  }).join('');
  const rows = ((mirrorData[mirrorTab] || {}).rows || []).filter(c => {
    try { return !JSON.parse(localStorage.getItem('mirror_done') || '{}')[c.address]; } catch { return true; }
  });
  $('shown').textContent = rows.length + ' SHOWN';
  $('mirror').innerHTML = rows.length ? rows.map((c, i) =>
    `<div class="coin"><div class="i">${String(i + 1).padStart(2, '0')}</div>
       <div><div class="n">${esc(c.symbol)}</div><div class="d">${esc(c.name || '')}</div></div>
       <div class="m">${c.usdMc ? money(c.usdMc) : ''}</div>
       <div class="mfb">
         <button class="ok" onclick="mirrorFeedback('${esc(c.address)}','${esc(c.symbol)}',true,this)">✓</button>
         <button class="x" onclick="mirrorFeedback('${esc(c.address)}','${esc(c.symbol)}',false,this)">✗</button>
       </div>
       <a class="btn" href="${chartUrl(c.address)}" target="_blank" rel="noopener">Open ↗</a></div>`).join('')
    : `<div class="empty">${(mirrorData[mirrorTab] && mirrorData[mirrorTab].err) ? 'LIST UNAVAILABLE: ' + esc(mirrorData[mirrorTab].err) : 'WAITING FOR DATA…'}</div>`;
  const ts = (mirrorData[mirrorTab] || {}).ts;
  $('mirrorFoot').textContent = ts ? `BOT LIST UPDATED ${clock(ts)} · TOP ${rows.length}` : '';
}

async function load() {
  try {
    const [st, rep, sigs, trades, pl] = await Promise.all([
      get('/state'), get('/report'), get('/signals?limit=50'),
      get('/trades').catch(() => []), get('/reallists').catch(() => ({}))
    ]);
    mirrorData = pl || {}; renderMirror();
    $('updated').textContent = 'UPDATED ' + clock(Date.now());

    const real = st.mode === 'REAL', r = st.risk || {}, lim = st.limits || {}, stt = st.stats || {};
    $('mode').textContent = real ? '● REAL' : 'SHADOW';
    $('mode').className = 'badge ' + (real ? 'real' : 'shadow');
    $('haltNote').innerHTML = st.halted ? '<span class="r">HALTED</span>' : '';

    $('engine').innerHTML =
      row('Halted', st.halted ? '<span class="r">YES</span>' : '<span class="g">No</span>') +
      row('Kill switch', r.killed ? '<span class="r">TRIPPED</span>' : '<span class="g">Armed</span>') +
      row('Trades / hr', `${r.tradesLastHour || 0} / ${lim.maxTradesPerHour ?? '—'}`) +
      row('Watchlist', `${st.watchlist || 0} coins`);

    const pos = (st.positions || []).filter(p => !reacted[p.id || p.mint]);
    $('posCount').textContent = pos.length + ' ACTIVE';
    $('positions').innerHTML = pos.length ? pos.map(p =>
      `<div class="card"><div class="head"><span class="sym"><a href="${chartUrl(p.mint)}" target="_blank" rel="noopener">${esc(p.symbol)}</a></span>
         <span class="small">${Math.round(p.heldMin || 0)}M HELD</span></div>
       <div class="sub">${esc(p.setup || '')} setup${p.simulated ? ' · simulated' : ''}</div>
       <div class="hr"></div>
       ${row('Entry', sol(p.entrySol) + ' SOL')}${row('Remaining', Math.round((p.remainingFrac ?? 1) * 100) + '%')}${row('Peak', (p.peakRatio ?? 1).toFixed(2) + '×')}
       <div class="addr">${esc(p.mint)}</div>
       <button class="btn" onclick="navigator.clipboard.writeText('${esc(p.mint)}');this.textContent='COPIED ✓';setTimeout(()=>this.textContent='COPY CA',1200)">COPY CA</button>
       <button class="btn ghost" data-mint="${esc(p.mint)}" data-symbol="${esc(p.symbol)}" data-good="0" data-sid="${esc(p.id || '')}" data-kind="position" onclick="fbHandler(this)">👎 Don't ape these</button>
       <button class="btn ghost" onclick="if(confirm('Remove ${esc(p.symbol)} from tracking?'))fetch(API+'/positions/${esc(p.id||p.mint)}',{method:'DELETE'}).then(()=>load())" style="color:var(--red)">✕ Remove</button></div>`
    ).join('') : '<div class="empty">NO OPEN POSITIONS</div>';

    const closed = (trades || []).filter(t => t.type === 'close');
    $('closedCount').textContent = closed.length + ' CLOSED';
    $('trades').innerHTML = closed.length ? closed.slice(0, 12).map(t =>
      `<div class="card"><div class="head"><span class="sym">${esc(t.symbol)}</span>
         <span class="pnl ${t.pnlSol >= 0 ? 'g' : 'r'}">${t.pnlSol >= 0 ? '+' : ''}${sol(t.pnlSol)} SOL</span></div>
       <div class="sub">${esc(t.setup || '')}${t.heldMin != null ? ' · ' + t.heldMin + 'm' : ''}${t.simulated ? ' · simulated' : ''}</div>
       <div class="hr"></div><div class="small"><span>${esc(t.reason || '')}</span><span>${t.ts ? clock(t.ts) : ''}</span></div></div>`
    ).join('') : '<div class="empty">NO CLOSED TRADES YET</div>';

    $('day').textContent = r.day || '';
    $('ledger').innerHTML =
      row('Day P&amp;L', `<span class="${(r.dayPnlSol || 0) >= 0 ? 'g' : 'r'}">${sol(r.dayPnlSol, 4)} SOL</span>`) +
      row('Loss ceiling', sol(r.dailyLossSol ?? lim.dailyLossSol) + ' SOL') +
      row('Starting equity', sol(r.startEquitySol) + ' SOL') +
      row('Per trade', sol(lim.tradeSol, 3) + ' SOL') +
      row('Max positions', lim.maxPositions ?? '—');

    $('errCount').textContent = (stt.errors || 0) + ' ERRORS';
    const cell = (l, n) => `<div><div class="l">${l}</div><div class="n">${n ?? 0}</div></div>`;
    $('machine').innerHTML = cell('Discover', stt.discoverTicks) + cell('Poll', stt.pollTicks) + cell('Position', stt.positionTicks) +
      cell('Signals', stt.signals) + cell('Entries', stt.entries) + cell('Exits', stt.exits);
    $('heartbeat').textContent = stt.lastDiscoverTs ? `Discovery heartbeat ${Math.round((Date.now() - stt.lastDiscoverTs) / 1000)}s ago · ${clock(stt.lastDiscoverTs)}` : '';
    if (stt.lastError) $('heartbeat').innerHTML += `<br><span class="err">last error: ${esc(typeof stt.lastError === 'string' ? stt.lastError : JSON.stringify(stt.lastError)).slice(0, 160)}</span>`;

    const sc = Object.entries(stt.sourceCounts || {});
    $('srcCount').textContent = sc.length + ' SOURCES';
    $('sources').innerHTML = sc.length ? sc.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v.returned ?? 0)}</td><td class="g">${esc(v.taken ?? 0)}</td></tr>`).join('')
      : '<tr><td colspan="3" class="empty">NO DATA</td></tr>';

    const s = (sigs || []).filter(x => !reacted[x.id || x.mint]).slice(0, 10);
    $('sigCount').textContent = s.length + ' RECENT';
    $('signals').innerHTML = s.length ? s.map(x => {
      const cant = x.decision !== 'taken';
      const why = x.decision === 'taken' ? 'Entry signal accepted by the engine.' : ((x.reasons && x.reasons[0]) || x.setup || '');
      return `<div class="card"><div class="head"><span class="sym">${esc(x.symbol)}</span><span class="tag ${esc(x.decision)}">${esc(String(x.decision).toUpperCase())}</span></div>
        <div class="head"><span class="addr" style="flex:1">${esc(x.mint)}</span><span class="small">${x.ts ? ago(x.ts) : ''}</span></div>
        <a class="btn" href="${chartUrl(x.mint)}" target="_blank" rel="noopener">Open chart ↗</a>
        <div class="reason">${esc(x.setup || '')} · MC ${money(x.mc)}${x.setup ? '' : ''}<br>${esc(why)}</div>
        ${x.decision === 'skipped' ? `<div class="fb"><span>Was this a good skip?</span><div>
          <button class="x" data-mint="${esc(x.mint)}" data-symbol="${esc(x.symbol)}" data-good="1" data-sid="${esc(x.id || '')}" data-kind="signal" onclick="fbHandler(this)">✗</button>
          <button class="ok" data-mint="${esc(x.mint)}" data-symbol="${esc(x.symbol)}" data-good="0" data-sid="${esc(x.id || '')}" data-kind="signal" onclick="fbHandler(this)">✓</button></div></div>` : ''}</div>`;
    }).join('') : '<div class="empty">NO SIGNALS YET</div>';

    const t = rep.trades || {}, fb = rep.feedback || {};
    $('perfNote').textContent = (rep.signals || 0) + ' SIGNALS LOGGED';
    $('perf').innerHTML =
      row('Closed trades', t.closed || 0) +
      row('Win rate', t.closed ? Math.round((t.wins || 0) / t.closed * 100) + '%' : '—') +
      row('Total P&amp;L', `<span class="${(t.totalPnlSol || 0) >= 0 ? 'g' : 'r'}">${(t.totalPnlSol || 0) >= 0 ? '+' : ''}${sol(t.totalPnlSol)} SOL</span>`) +
      row('Feedback given', fb.total || 0) +
      (fb.contested && Object.keys(fb.contested).length ? row('⚠ Contested', esc(Object.keys(fb.contested).join(', '))) : '');
  } catch (e) { $('updated').innerHTML = '<span class="err">ERROR: ' + esc(e.message) + '</span>'; }
}
renderMirror(); load(); setInterval(load, REFRESH_MS);
