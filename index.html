<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgebot Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;padding:20px 16px 100px;max-width:600px;margin:0 auto}
.section-label{font-size:11px;color:#888;letter-spacing:2px;text-transform:uppercase;margin:24px 0 4px}
.section-title{font-size:32px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.section-title .count{font-size:11px;color:#888;letter-spacing:2px;font-weight:400}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin:12px 0}
.pos-symbol{font-size:28px;font-weight:700;margin-bottom:2px}
.pos-setup{font-size:14px;color:#888;margin-bottom:16px}
.pos-held{font-size:11px;color:#888;letter-spacing:1px;float:right;margin-top:8px}
.stats{display:flex;justify-content:space-between;margin:16px 0;padding:16px 0;border-top:1px solid #222;border-bottom:1px solid #222}
.stat{text-align:left}
.stat .label{font-size:10px;color:#666;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.stat .value{font-size:18px;font-weight:700}
.stat .value.green{color:#2DD4BF}
.ca-row{display:flex;align-items:center;gap:10px;margin:12px 0}
.ca-text{font-family:monospace;font-size:12px;color:#666;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{background:#4ade80;color:#000;border:none;border-radius:6px;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer}
.dont-ape{width:100%;background:transparent;border:1px solid #f87171;color:#f87171;border-radius:8px;padding:14px;font-size:13px;font-weight:700;letter-spacing:1.5px;cursor:pointer;margin-top:8px}
.sig-card{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin:10px 0}
.sig-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sig-symbol{font-size:18px;font-weight:700;color:#2DD4BF}
.sig-symbol a{color:#2DD4BF;text-decoration:none}
.sig-decision{font-size:13px;color:#fbbf24}
.sig-reason{font-size:13px;color:#888;margin-bottom:12px;line-height:1.4}
.sig-btns{display:flex;gap:10px}
.sig-btns button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;font-weight:600}
.btn-good{background:#1a3a2a;color:#2DD4BF}
.btn-bad{background:#3a1a1a;color:#f87171}
.meta-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a;font-size:15px}
.meta-row:last-child{border:none}
.meta-label{color:#888}
.meta-val{font-weight:600}
.green{color:#2DD4BF}.red{color:#f87171}.yellow{color:#fbbf24}
.mirror-tabs{display:flex;gap:8px;margin:12px 0}
.mirror-tabs button{flex:1;padding:10px;background:#1a1a1a;color:#888;border:1px solid #222;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.mirror-tabs button.active{background:#2DD4BF;color:#000;border-color:#2DD4BF}
.mirror-list{max-height:400px;overflow-y:auto}
.mirror-coin{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a1a}
.mirror-coin .sym{font-weight:700;font-size:15px}
.mirror-coin .sym a{color:#fff;text-decoration:none}
.mirror-coin .mc{font-size:12px;color:#888}
.updated{font-size:12px;color:#666;margin-bottom:8px}
.refresh{position:fixed;bottom:20px;right:20px;background:#2DD4BF;color:#000;border:none;border-radius:50%;width:56px;height:56px;font-size:24px;cursor:pointer;z-index:10}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="updated" id="updated">connecting…</div>

<div class="section-label">Live Trading</div>
<div class="section-title">Engine <span class="count" id="modeBadge"></span></div>
<div class="card" id="engine"><div class="meta-row"><span class="meta-label">Loading…</span></div></div>

<div class="section-label">Open Risk</div>
<div class="section-title">Positions <span class="count" id="posCount"></span></div>
<div id="positions"><div class="card"><div class="meta-row"><span class="meta-label">Loading…</span></div></div></div>

<div class="section-label">Signals</div>
<div class="section-title">Recent <span class="count">LIVE</span></div>
<div id="signals"><div class="card"><div class="meta-row"><span class="meta-label">Loading…</span></div></div></div>

<div class="section-label">Stats</div>
<div class="section-title">Performance</div>
<div class="card" id="report"><div class="meta-row"><span class="meta-label">Loading…</span></div></div>

<div class="section-label">Discovery</div>
<div class="section-title">Sources</div>
<div class="card" id="sources"><div class="meta-row"><span class="meta-label">Loading…</span></div></div>

<div class="section-label">Mirror</div>
<div class="section-title">Pump.fun <span class="count">LIVE</span></div>
<div class="card">
<div class="mirror-tabs">
<button onclick="showMirror('trending')" id="tab-trending" class="active">Trending</button>
<button onclick="showMirror('movers')" id="tab-movers">Movers</button>
<button onclick="showMirror('new')" id="tab-new">New</button>
<button onclick="showMirror('graduated')" id="tab-graduated">Graduated</button>
</div>
<div class="mirror-list" id="mirror"><div class="meta-row"><span class="meta-label">Loading…</span></div></div>
</div>

<button class="refresh" onclick="load()">↻</button>

<script>
const API='https://edgebot.onrender.com';
let reacted = JSON.parse(localStorage.getItem('edgebot_reacted')||'{}');
function saveReacted(){ localStorage.setItem('edgebot_reacted', JSON.stringify(reacted)); }
async function get(p){const r=await fetch(API+p+'?t='+Date.now(),{cache:'no-store'});return r.json();}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function copyCA(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(()=>{ btn.textContent = orig; }, 1200);
  });
}
async function feedback(mint,symbol,good,signalId,btn,kind){
  btn.disabled=true;
  try{
    await fetch(API+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mint,symbol,good,signalId,kind})});
    const key = signalId || mint;
    reacted[key] = true; saveReacted();
    const el = btn.closest(kind==='position' ? '.card' : '.sig-card');
    if(el){ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 320); }
  }catch(e){btn.disabled=false;alert("COULDN'T SAVE - TRY AGAIN");}
}
let mirrorData = {}, mirrorTab = 'trending';
function showMirror(tab){
  mirrorTab = tab;
  ['trending','movers','new','graduated'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  renderMirror();
}
function renderMirror(){
  const rows = (mirrorData[mirrorTab] && mirrorData[mirrorTab].rows) || [];
  document.getElementById('mirror').innerHTML = rows.length ? rows.map((c,i)=>
    '<div class="mirror-coin"><div><div class="sym"><a href="https://pump.fun/coin/'+esc(c.address)+'" target="_blank">'+esc(c.symbol)+'</a></div>'+
    '<div class="mc">'+esc(c.name||'')+(c.usdMc?' · $'+Math.round(c.usdMc).toLocaleString():'')+'</div></div>'+
    '<div class="mc">#'+(i+1)+'</div></div>'
  ).join('') : '<div class="meta-row"><span class="meta-label">Waiting for data…</span></div>';
}
async function load(){
  try{
    const [st,rep,sigs,pl]=await Promise.all([get('/state'),get('/report'),get('/signals?limit=50'),get('/pumplists').catch(()=>({}))]);
    mirrorData = pl||{}; renderMirror();
    document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString();
    const r=st.risk||{};
    document.getElementById('modeBadge').textContent = st.mode==='REAL' ? '● REAL' : 'SHADOW';
    document.getElementById('modeBadge').style.color = st.mode==='REAL' ? '#f87171' : '#2DD4BF';
    document.getElementById('engine').innerHTML =
      mrow('Halted', st.halted?'<span class="red">YES</span>':'<span class="green">No</span>')+
      mrow('Day P&L', ((r.dayPnlSol||0)>=0?'<span class="green">':'<span class="red">')+(r.dayPnlSol||0).toFixed(4)+' SOL</span>')+
      mrow('Trades/hr', (r.tradesLastHour||0)+' / '+(st.limits?.maxTradesPerHour||6))+
      mrow('Watchlist', (st.watchlist||0)+' coins');
    const pos=(st.positions||[]).filter(p=>!reacted[p.id||p.mint]);
    document.getElementById('posCount').textContent = pos.length+' ACTIVE';
    document.getElementById('positions').innerHTML = pos.length ? pos.map(p=>{
      const pid = esc(p.id||'');
      const pnl = p.pnlPct!=null ? (p.pnlPct>=0?'+':'')+p.pnlPct.toFixed(1)+'%' : '+0.0%';
      const peak = p.peakX!=null ? p.peakX.toFixed(2)+'×' : '—';
      return '<div class="card"><div class="pos-held">'+Math.round(p.heldMin||0)+'M HELD</div>'+
      '<div class="pos-symbol"><a href="https://pump.fun/coin/'+esc(p.mint)+'" target="_blank" style="color:#fff;text-decoration:none">'+esc(p.symbol)+'</a></div>'+
      '<div class="pos-setup">'+esc(p.setup||'')+' setup</div>'+
      '<div class="stats"><div class="stat"><div class="label">Entry</div><div class="value">'+esc(p.entrySol||'0.02')+' SOL</div></div>'+
      '<div class="stat"><div class="label">Remaining</div><div class="value">'+pnl+'</div></div>'+
      '<div class="stat"><div class="label">Peak</div><div class="value">'+peak+'</div></div></div>'+
      '<div class="ca-row"><div class="ca-text">'+esc(p.mint)+'</div><button class="copy-btn" onclick="copyCA(\''+esc(p.mint)+'\',this)">COPY CA</button></div>'+
      '<button class="dont-ape" onclick="feedback(\''+esc(p.mint)+'\',\''+esc(p.symbol)+'\',false,\''+pid+'\',this,\'position\')">👎&nbsp;&nbsp;DON\'T APE THESE</button></div>';
    }).join('') : '<div class="card"><div class="meta-row"><span class="meta-label">No open positions</span></div></div>';
    const s=(sigs||[]).filter(x=>!reacted[x.id||x.mint]);
    document.getElementById('signals').innerHTML = s.length ? s.map(x=>{
      const skipped=x.decision==='skipped';
      const sid=esc(x.id||'');
      return '<div class="sig-card"><div class="sig-top"><span class="sig-symbol"><a href="https://pump.fun/coin/'+esc(x.mint)+'" target="_blank">'+esc(x.symbol)+'</a></span>'+
      '<span class="sig-decision">'+esc(x.decision)+'</span></div>'+
      '<div class="sig-reason">'+esc(x.setup)+' · MC $'+Math.round(x.mc||0).toLocaleString()+(x.reasons&&x.reasons.length?' · '+esc(x.reasons[0]):"")+'</div>'+
      (skipped?'<div class="sig-btns"><button class="btn-good" onclick="feedback(\''+esc(x.mint)+'\',\''+esc(x.symbol)+'\',true,\''+sid+'\',this,\'signal\')">✓ good</button><button class="btn-bad" onclick="feedback(\''+esc(x.mint)+'\',\''+esc(x.symbol)+'\',false,\''+sid+'\',this,\'signal\')">✗ skip ok</button></div>':'')+'</div>';
    }).join('') : '<div class="card"><div class="meta-row"><span class="meta-label">No signals yet</span></div></div>';
    const t=rep.trades||{}, fb=rep.feedback||{};
    document.getElementById('report').innerHTML =
      mrow('Closed trades', t.closed||0)+
      mrow('Win rate', t.closed?Math.round((t.wins||0)/t.closed*100)+'%':'—')+
      mrow('Total P&L', ((t.totalPnlSol||0)>=0?'<span class="green">+':'<span class="red">')+(t.totalPnlSol||0).toFixed(4)+' SOL</span>')+
      mrow('Feedback given', fb.total||0)+
      (fb.contested&&Object.keys(fb.contested).length?mrow('⚠ Contested', Object.keys(fb.contested).join(', ')):'');
    const sc=(st.stats&&st.stats.sourceCounts)||{};
    document.getElementById('sources').innerHTML = Object.entries(sc).sort().map(([k,v])=>mrow(esc(k), esc(v.taken||0)+' / '+esc(v.returned||0))).join('') || '<div class="meta-row"><span class="meta-label">No data</span></div>';
  }catch(e){ document.getElementById('updated').textContent='error: '+e.message; }
}
function mrow(l,v){return '<div class="meta-row"><span class="meta-label">'+l+'</span><span class="meta-val">'+v+'</span></div>';}
load();setInterval(load,10000);
</script>
</body>
</html>
